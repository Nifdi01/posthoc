name: Dev CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff lint
        run: |
          ruff check . --fix
          ruff check .

      - name: Black format check
        run: black --check . --target-version py312

  test:
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install PLINK2
        run: |
          wget -q https://s3.amazonaws.com/plink2-assets/alpha7/plink2_linux_x86_64_20260808.zip -O plink2.zip
          unzip -q plink2.zip
          sudo mv plink2 /usr/local/bin/
          plink2 --version

      - name: Cache raw data
        id: cache-raw
        uses: actions/cache@v4
        with:
          path: datasets/data/raw
          key: raw-data-v1-${{ hashFiles('scripts/prepare_data.sh') }}

      - name: Cache processed chr22 subset
        id: cache-processed
        uses: actions/cache@v4
        with:
          path: datasets/data/processed
          key: processed-data-v1-${{ hashFiles('scripts/prepare_data.sh') }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Download and set up data
        run: bash scripts/prepare_data.sh

      - name: Run tests
        run: pytest --cov=posthoc --cov-report=term-missing
